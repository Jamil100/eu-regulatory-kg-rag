[project]
name = "kg-rag-eu-ai-act"
version = "0.1.0"
description = "Hybrid Knowledge Graph + Vector RAG over the EU AI Act and GDPR on the Cohere stack."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cohere>=5.0",
    "neo4j>=5.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tenacity>=8.2",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
